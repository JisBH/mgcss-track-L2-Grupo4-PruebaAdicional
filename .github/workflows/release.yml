name: Release automatica

on:
  push:
    tags:
      - 'v*' 

jobs:
  release:
    name: Build, Dockerize and Release
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Permisos para que el GITHUB_TOKEN 
    # pueda crear la release en el repositorio automáticamente.
    permissions:
      contents: write 

    steps:
      # 1. Hacer checkout
      - name: Checkout del código
        uses: actions/checkout@v4

      # Configurar el entorno Java
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 2 y 3. Compilar proyecto y generar artefacto (.jar)
      - name: Compilar y empaquetar con Maven
        run: mvn -B clean package -DskipTests

      # 4. Construir imagen Docker
      - name: Construir imagen Docker
        run: |
          echo "Construyendo imagen para la versión: ${{ github.ref_name }}"
          
          # Etiquetamos con la versión exacta (ej. v1.1.0) y también como latest
          docker build -t mgcss-track:${{ github.ref_name }} -t mgcss-track:latest .
        
      # 5. Publicar Release en GitHub
      - name: Crear GitHub Release y subir artefacto
        uses: softprops/action-gh-release@v1
        with:
          # Adjuntamos el .jar generado en la carpeta target
          files: target/*.jar 
          # GitHub generará automáticamente las release notes basándose en los commits
          generate_release_notes: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}