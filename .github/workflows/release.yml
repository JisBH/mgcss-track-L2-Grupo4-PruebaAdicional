name: Release automatica

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Dockerize and Release
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Permisos para que el GITHUB_TOKEN 
    # pueda crear la release en el repositorio automáticamente.
    permissions:
      contents: write

    steps:
      # 1. Hacer checkout
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno Java
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Compilar proyecto y generar artefacto (.jar)
      - name: Compilar y empaquetar con Maven
        run: mvn -B clean package -DskipTests

      # 4. Iniciar sesión en Docker Hub
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Construir y hacer Push de la imagen Docker
      - name: Construir y subir imagen Docker
        run: |
          echo "Construyendo y subiendo imagen para la versión: ${{ github.ref_name }}"
          
          # Etiquetamos con el namespace de tu usuario de Docker Hub
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/mgcss-track"
          
          docker build -t $IMAGE_NAME:${{ github.ref_name }} -t $IMAGE_NAME:latest .
          
          # Subimos ambas etiquetas (la versión exacta y la última) al registro
          docker push $IMAGE_NAME:${{ github.ref_name }}
          docker push $IMAGE_NAME:latest
        
      # 6. Publicar Release en GitHub
      - name: Crear GitHub Release y subir artefacto
        uses: softprops/action-gh-release@v1
        with:
          files: target/*.jar 
          generate_release_notes: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}