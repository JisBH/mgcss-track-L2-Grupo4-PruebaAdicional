<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Solicitud | Grupo 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">🛠️ Grupo 4 - Soporte</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="d-flex align-items-center mb-3">
                    <a href="index.html" class="btn btn-outline-secondary btn-sm me-3">&larr; Volver</a>
                    <h2 class="mb-0">Crear Nueva Solicitud</h2>
                </div>

                <div class="card card-custom p-4">
                    <form id="form-nueva-solicitud">
                        <div class="mb-3">
                            <label for="clienteId" class="form-label">ID del Cliente</label>
                            <input type="number" class="form-control" id="clienteId" required placeholder="Ej: 101">
                        </div>
                        
                        <div class="mb-4">
                            <label for="descripcion" class="form-label">Descripción del problema</label>
                            <textarea class="form-control" id="descripcion" rows="4" required placeholder="Detalla el problema aquí..."></textarea>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Guardar Solicitud</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
