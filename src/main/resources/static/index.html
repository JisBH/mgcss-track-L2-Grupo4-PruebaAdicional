<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGCSS - Panel de Gestión de Solicitudes</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Estilos limpios para el Modal de asignación */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.5);
            align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: #fff; padding: 25px; border-radius: 8px;
            width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; font-size: 1.5rem; color: var(--primary);">MGCSS Mantenimiento</h1>
            <p style="margin:5px 0 0; color: var(--secondary);">Gestión Integral de Solicitudes</p>
        </div>
        
        <div class="session-panel">
            <strong>Actuar como:</strong>
            <select id="userRole" onchange="switchRole()">
                <option value="ADMIN">Administrador</option>
            </select>
            <button class="btn-ghost" onclick="initData()">Refrescar ↻</button>
        </div>
    </header>

    <div style="margin-bottom: 20px;">
        <button class="btn-primary admin-only" onclick="abrirModalSolicitud()">+ Nueva Solicitud</button>
        <button class="btn-ghost admin-only" onclick="crearTecnico()">+ Registrar Nuevo Técnico</button>
        <button class="btn-ghost admin-only" onclick="solicitarNombreCliente()">+ Registrar Nuevo Cliente</button> 
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Fecha / Descripción</th>
                <th>Cliente</th> <th>Estado</th>
                <th>Técnico</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="solicitudesTable">
            </tbody>
    </table>
</div>

<div id="modalSolicitud" class="modal">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: var(--primary);">Abrir Nueva Solicitud de Tarea</h3>
        
        <div class="form-group">
            <label for="solicitudDescripcion">Descripción de la Incidencia:</label>
            <input type="text" id="solicitudDescripcion" class="form-control" placeholder="Ej. Error en servidor de correo...">
        </div>
        
        <div class="form-group">
            <label for="solicitudCliente">Cliente Solicitante (Asignación):</label>
            <select id="solicitudCliente" class="form-control" required>
                <option value="">-- Selecciona un Cliente --</option>
                </select>
        </div>
        
        <div class="modal-actions">
            <button class="btn-ghost" onclick="cerrarModalSolicitud()">Cancelar</button>
            <button class="btn-primary" onclick="guardarNuevaSolicitud()">Guardar Tarea</button>
        </div>
    </div>
</div>

<script src="js/app.js"></script>

</body>
</html>
